server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Only index.html's asset links carry a version stamp; the JS modules they
    # import don't. Revalidate everything (cheap, via ETag) so an update is
    # never half-served from cache.
    add_header Cache-Control "no-cache";

    # Boards route with #/b/<id>, so there's no history fallback to handle.
    location / {
        try_files $uri $uri/ =404;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;
    gzip_min_length 1024;
}
