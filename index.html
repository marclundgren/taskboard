<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="app-version" content="20260826T201704Z" />
<title>Taskboard</title>
<meta name="description" content="A self-hosted kanban task board with shared and private boards." />
<meta name="color-scheme" content="light dark" />
<meta name="theme-color" content="#6d5efc" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236d5efc'/%3E%3Crect x='7' y='8' width='5' height='16' rx='2' fill='white'/%3E%3Crect x='14' y='8' width='5' height='11' rx='2' fill='white' opacity='.85'/%3E%3Crect x='21' y='8' width='5' height='7' rx='2' fill='white' opacity='.6'/%3E%3C/svg%3E" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="stylesheet" href="./assets/css/styles.css?v=20260826T201704Z" />
</head>
<body>

<div id="app" class="app" hidden>
  <aside class="sidebar" id="sidebar" aria-label="Boards">
    <div class="sidebar__head">
      <div class="brand">
        <span class="brand__mark" aria-hidden="true"></span>
        <span class="brand__name">Taskboard</span>
      </div>
      <button class="icon-btn sidebar__close" id="sidebar-close" aria-label="Close menu">&times;</button>
    </div>

    <nav class="sidebar__nav" id="board-list"></nav>

    <div class="sidebar__foot">
      <button class="btn btn--ghost btn--block" id="new-board-btn">
        <span aria-hidden="true">+</span> New board
      </button>
      <div class="mode-chip" id="mode-chip" title="Storage mode"></div>
    </div>
  </aside>

  <div class="sidebar-scrim" id="sidebar-scrim" hidden></div>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn topbar__menu" id="sidebar-open" aria-label="Open menu">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/></svg>
      </button>

      <div class="topbar__title" id="board-title"></div>

      <div class="topbar__tools">
        <div class="search">
          <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="9" cy="9" r="5.5" stroke="currentColor" stroke-width="1.6" fill="none"/><path d="M13.5 13.5 17 17" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <input type="search" id="search-input" placeholder="Search tasks" aria-label="Search tasks" autocomplete="off" />
        </div>
        <button class="btn btn--ghost" id="filter-btn" aria-haspopup="dialog">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5h14M6 10h8M8.5 15h3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" fill="none"/></svg>
          <span>Filter</span><span class="badge" id="filter-count" hidden></span>
        </button>
        <div class="members" id="members"></div>
        <button class="btn btn--primary" id="add-task-btn">
          <span aria-hidden="true">+</span> Task
        </button>
        <button class="avatar-btn" id="user-btn" aria-haspopup="menu" aria-label="Account"></button>
      </div>
    </header>

    <main class="board" id="board" tabindex="-1"></main>
  </div>
</div>

<section class="auth" id="auth-screen" hidden>
  <div class="auth__card">
    <div class="brand brand--lg">
      <span class="brand__mark" aria-hidden="true"></span>
      <span class="brand__name">Taskboard</span>
    </div>
    <h1 class="auth__title">Your boards, your server.</h1>
    <p class="auth__sub" id="auth-sub"></p>
    <div class="auth__actions" id="auth-actions"></div>
    <p class="auth__note" id="auth-note"></p>
  </div>
</section>

<div class="boot" id="boot"><div class="spinner" aria-label="Loading"></div></div>

<div id="modal-root"></div>
<div id="menu-root"></div>
<div id="toast-root" class="toasts" aria-live="polite"></div>
<div id="sr-live" class="sr-only" role="status" aria-live="polite"></div>

<script type="module" src="./assets/js/app.js?v=20260826T201704Z"></script>
</body>
</html>
